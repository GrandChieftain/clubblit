<!DOCTYPE html>

{% block main %}

<html lang="en">
<head>
  <title>Nectar - Log In</title>
  <link rel="stylesheet" href="/static/main.css">
  <link rel="icon" href="/static/nectar.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <script src="/static/script.js" async defer></script>
</head>
<body>
  <div class="container">
    <div class="box-login">
      <form method="POST" action="/login" class="login-form">
        <h1 class="login-title">Log In</h1>
        <div class="login-input-1">
          {% if not_found %}
          <label class="input-title" for="username">Username<span class="error"> - Cannot be found</span></label>
          {% else %}
          <label class="input-title" for="username">Username</label>
          {% endif %}
          <input id="username" type="text" name="username" placeholder=""/>
        </div>
        <div class="login-input-2">
          {% if does_not_match %}
          <label class="input-title" for="password">Password<span class="error"> - Invalid, does not match</span></label>
          {% else %}
          <label class="input-title" for="password">Password</label>
          {% endif %}
          <input id="password" type="password" name="password" placeholder=""/>
          <a class="login-link" href="#">Forgot Your Password?</a>
        </div>
        <div class="submit-container">
          <input type="submit" value="Log In" class="login-submit"/>
          <span class="signup-required">New to Nectar? <a class="login-link" href="/signup">Sign Up</a></span>
        </div>
        <div class="side-image">
          <img class="honey_bear" src="/static/honey_bear.png" alt="">
        </div>
      </form>
    </div>
  </div>
</body>
</html>

{% endblock %}
